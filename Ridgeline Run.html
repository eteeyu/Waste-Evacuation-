<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridgeline Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9df;--fg:#1d1b3a;--muted:#5d5a78;--panel:#f7f3ec;--accent:#e2603a;--accent-fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e1f;--fg:#f4efe6;--muted:#a9a5c4;--panel:#1d1b3a;--accent:#f08a5d;--accent-fg:#1d1b3a}}
:root[data-theme="dark"]{--bg:#0f0e1f;--fg:#f4efe6;--muted:#a9a5c4;--panel:#1d1b3a;--accent:#f08a5d;--accent-fg:#1d1b3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage{position:relative;width:min(100%,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));aspect-ratio:16/9;max-height:100%}
canvas{width:100%;height:100%;display:block;border-radius:10px;background:#1d1b3a}
#hud{position:absolute;left:3%;top:4%;display:flex;gap:1.4em;font-weight:800;font-size:clamp(14px,2.6vw,26px);color:#f4efe6;text-shadow:0 1px 6px rgba(0,0,0,.45);pointer-events:none}
#hud small{display:block;font-weight:500;font-size:.55em;opacity:.8}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#card{background:var(--panel);color:var(--fg);padding:clamp(14px,3vw,30px) clamp(18px,4vw,44px);border-radius:14px;text-align:center;max-width:86%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h1{margin:0 0 .2em;font-size:clamp(24px,5vw,48px);font-weight:800;letter-spacing:-.02em}
p{margin:.3em 0 1em;color:var(--muted);font-size:clamp(12px,1.9vw,17px);line-height:1.45}
button{font:inherit;font-weight:700;font-size:clamp(14px,2.2vw,20px);background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:.6em 1.6em;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="stage">
<canvas id="c" width="1600" height="900" aria-label="Ridgeline Run game"></canvas>
<div id="hud"><div><small>Distance</small><span id="sc">0</span> m</div><div><small>Lanterns</small><span id="cn">0</span></div><div><small>Best</small><span id="bs">0</span> m</div></div>
<div id="ov"><div id="card">
<h1 id="t">Ridgeline Run</h1>
<p id="m">You’re a courier racing along the canyon ridge at dusk.<br>Press Space, ↑ or tap to jump. Hold for height, press again in the air to double jump.<br>Grab lanterns, dodge spikes, don’t fall.</p>
<button id="go">Start run</button>
</div></div>
</div>
<script>
(function(){
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=800,H=450;g.scale(2,2);
const $=id=>document.getElementById(id);
let best=0;try{best=+localStorage.getItem('ridge-best')||0}catch(e){}
$('bs').textContent=best;
let st='ready',cam=0,P,plats,coins,spikes,parts,t,speed,coinsN,dist,overAt=0,last=0,hold=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function reset(){
  P={x:100,y:300,vy:0,w:26,h:38,air:0,ground:false,coy:0,buf:0,run:0};
  plats=[{x:-300,y:340,w:850}];coins=[];spikes=[];parts=[];
  t=0;speed=300;coinsN=0;dist=0;cam=P.x-140;gen();
}
function gen(){
  let p=plats[plats.length-1];
  while(p.x+p.w<cam+W+700){
    const gap=rand(60,Math.min(0.42*speed,60+(speed-280)*.3+70));
    const y=clamp(p.y+rand(-70,60),230,390),w=rand(190,460);
    const n={x:p.x+p.w+gap,y,w};plats.push(n);
    if(w>290&&Math.random()<.55)spikes.push({x:n.x+rand(110,w-110),y,w:28});
    if(Math.random()<.8){const cx=n.x+rand(30,w-150);for(let i=0;i<4;i++)coins.push({x:cx+i*36,y:y-45-Math.sin(i/3*Math.PI)*42,got:false});}
    p=n;
  }
}
function burst(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-120,120),vy:rand(-200,20),l:rand(.3,.6),c});}
function jumpPress(){P.buf=.12;hold=true}
function jumpRelease(){hold=false;if(P&&P.vy<-220)P.vy=-220}

function update(dt){
  t+=dt;speed=Math.min(540,300+t*5);
  P.x+=speed*dt;cam=P.x-140;
  P.vy+=1900*dt;const pb=P.y+P.h;P.y+=P.vy*dt;
  let ground=false;
  for(const p of plats){
    if(P.x+P.w>p.x+4&&P.x<p.x+p.w-2){
      const b=P.y+P.h;
      if(P.vy>=0&&pb<=p.y+6&&b>=p.y){P.y=p.y-P.h;P.vy=0;ground=true}
      else if(b>p.y+16){return die()}
    }
  }
  if(ground){if(!P.ground){burst(P.x+13,P.y+P.h,'#f4efe6',6)}P.air=0;P.coy=.1}else P.coy-=dt;
  P.ground=ground;
  P.buf-=dt;
  if(P.buf>0){
    if(ground||P.coy>0){P.vy=-640;P.coy=0;P.buf=0;P.ground=false;burst(P.x+13,P.y+P.h,'#f4efe6',5)}
    else if(P.air<1){P.air++;P.vy=-570;P.buf=0;burst(P.x+13,P.y+P.h,'#ffc857',8)}
  }
  P.run+=dt*speed*.03;
  if(P.y>H+80)return die();
  for(const s of spikes)if(P.x+P.w-6>s.x+4&&P.x+6<s.x+s.w-4&&P.y+P.h>s.y-20&&P.y+P.h<s.y+14)return die();
  const cx=P.x+13,cy=P.y+19;
  for(const c of coins)if(!c.got&&Math.abs(c.x-cx)<24&&Math.abs(c.y-cy)<26){c.got=true;coinsN++;burst(c.x,c.y,'#ffc857',8)}
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.l-=dt}
  parts=parts.filter(q=>q.l>0);
  while(plats.length>3&&plats[0].x+plats[0].w<cam-250)plats.shift();
  coins=coins.filter(c=>c.x>cam-60&&!c.got);spikes=spikes.filter(s=>s.x>cam-60);
  gen();
  dist=Math.max(0,Math.floor((P.x-100)/10));
  $('sc').textContent=dist+coinsN*10;$('cn').textContent=coinsN;
}
function die(){
  st='over';overAt=performance.now()+450;
  const sc=dist+coinsN*10;burst(P.x+13,P.y+19,'#e5484d',16);
  let nb=sc>best;if(nb){best=sc;try{localStorage.setItem('ridge-best',best)}catch(e){}}
  $('bs').textContent=best;
  $('t').textContent=nb?'New best!':'Run over';
  $('m').innerHTML='You scored <b>'+sc+'</b> ('+dist+' m plus '+coinsN+' lanterns).<br>Best: '+best+'.';
  $('go').textContent='Run again';$('ov').classList.remove('hide');
}
function start(){
  if(st==='playing')return;
  if(st==='over'&&performance.now()<overAt)return;
  reset();st='playing';$('ov').classList.add('hide');
}

function ridge(f,base,amp,col,ph){
  g.fillStyle=col;g.beginPath();g.moveTo(0,H);
  for(let x=0;x<=W;x+=10){const wx=x+cam*f;g.lineTo(x,base+Math.sin(wx*.004+ph)*amp+Math.sin(wx*.011+ph*2)*amp*.35)}
  g.lineTo(W,H);g.fill();
}
function draw(){
  const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#1d1b3a');sk.addColorStop(.55,'#5a3566');sk.addColorStop(1,'#f08a5d');
  g.fillStyle=sk;g.fillRect(0,0,W,H);
  g.fillStyle='#ffc857';g.beginPath();g.arc(600,250,46,0,7);g.fill();
  ridge(.1,250,38,'#4a2c5e',1);ridge(.25,310,34,'#3a2a55',3);ridge(.5,370,26,'#262a4a',5);
  g.save();g.translate(-Math.round(cam),0);
  for(const p of plats){
    g.fillStyle='#2c3550';g.fillRect(p.x,p.y,p.w,H-p.y+10);
    g.fillStyle='#7ea1b8';g.fillRect(p.x,p.y,p.w,5);
    g.fillStyle='#232b44';for(let x=p.x+30;x<p.x+p.w-10;x+=46)g.fillRect(x,p.y+22+((x/46|0)%3)*22,24,4);
  }
  g.fillStyle='#e5484d';
  for(const s of spikes){g.beginPath();g.moveTo(s.x,s.y);g.lineTo(s.x+s.w/2,s.y-26);g.lineTo(s.x+s.w,s.y);g.fill()}
  for(const c of coins){
    const sw=Math.abs(Math.cos(c.x*.02+performance.now()*.004))*7+2;
    g.fillStyle='#ffc857';g.beginPath();g.ellipse(c.x,c.y,sw,10,0,0,7);g.fill();
    g.fillStyle='rgba(255,200,87,.25)';g.beginPath();g.arc(c.x,c.y,15,0,7);g.fill();
  }
  if(P){
    const x=P.x,y=P.y,leg=P.ground?Math.sin(P.run)*9:5;
    g.strokeStyle='#f08a5d';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(x+6,y+10);
    g.quadraticCurveTo(x-14,y+10-P.vy*.02,x-30,y+14+Math.sin(performance.now()*.02)*4-P.vy*.03);g.stroke();
    g.strokeStyle='#f4efe6';g.lineWidth=6;
    g.beginPath();g.moveTo(x+10,y+28);g.lineTo(x+10+leg,y+P.h);g.moveTo(x+16,y+28);g.lineTo(x+16-leg,y+P.h);g.stroke();
    g.fillStyle='#f4efe6';g.beginPath();g.roundRect(x+2,y+8,22,24,7);g.fill();
    g.beginPath();g.arc(x+15,y+7,8,0,7);g.fill();
    g.fillStyle='#1d1b3a';g.fillRect(x+17,y+4,4,4);
  }
  for(const q of parts){g.globalAlpha=clamp(q.l*3,0,1);g.fillStyle=q.c;g.fillRect(q.x,q.y,4,4)}
  g.globalAlpha=1;g.restore();
}
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(st==='playing')update(dt);
  else{cam+=60*dt;if(P){for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;q.l-=dt}parts=parts.filter(q=>q.l>0)}}
  draw();requestAnimationFrame(loop);
}
reset();st='ready';P.x=100;
// idle scene: keep the runner standing on the first ledge
$('go').addEventListener('click',start);
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){
    e.preventDefault();if(e.repeat)return;
    if(st==='playing')jumpPress();else start();
  }
});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))jumpRelease()});
cv.addEventListener('pointerdown',e=>{if(st==='playing'){e.preventDefault();jumpPress()}});
addEventListener('pointerup',()=>{if(st==='playing')jumpRelease()});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
